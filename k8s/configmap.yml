apiVersion: v1
kind: ConfigMap
metadata:
  name: assessment-config
  namespace: assessment
  labels:
    app.kubernetes.io/name: assessment
data:
  # Integration
  INTEGRATION_UPSTREAM_URL: "http://localhost:8080/upstream/process"
  # Observability
  OTEL_SAMPLING_PROBABILITY: "1.0"
  # Demo upstream
  DEMO_FAILURE_RATE: "0.6"
  DEMO_LATENCY_MS: "0"
  # JVM tuning
  JAVA_OPTS: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=75.0
    -XX:InitialRAMPercentage=50.0
    -Djava.security.egd=file:/dev/./urandom
